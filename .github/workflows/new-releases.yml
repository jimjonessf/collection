# Weekly check for new albums by the artists in The Collection (adds them to Discographies and New Releases).
# Runs every Monday at about 3:17 AM Pacific; "Run workflow" on the Actions tab runs it right away.
name: New releases

on:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look up new albums on MusicBrainz
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python3 weekly/new_releases.py
      - name: Save the results
        run: |
          git config user.name "The Collection weekly check"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly/new_releases.json
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Weekly new releases check"
          git push
      - name: Ask GitHub Pages to refresh the site
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
